name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch: 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta källkoden från GitHub
      - uses: actions/checkout@v4

      # 2. Installera och konfigurera Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Sätt upp Node och konfigurera npm-registryt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npmjs.org
          cache: '' 

      # 4. Installera projektberoenden med Bun
      - run: bun install --frozen-lockfile

      # 5. Bygg projektet (Ta bort denna rad om du inte har ett build-script i package.json)
      - run: bun run build

      # 6. Publicera paketet till npm
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
