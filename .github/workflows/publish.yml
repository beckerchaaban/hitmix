name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Hämta koden
      - uses: actions/checkout@v4

      # 2. Sätt upp Bun
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Sätt upp Node (Ta bort "registry-url" härifrån, den flyttas till npm publish)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 4. Installera beroenden med Bun
      - run: bun install --frozen-lockfile

      # 5. Bygg projektet (Ta bort denna rad om du inte har ett build-script)
      - run: bun run build

      # 6. Publicera till npm (Vi sätter registry direkt i kommandot för säkerhets skull)
      - run: npm publish --registry=https://npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}